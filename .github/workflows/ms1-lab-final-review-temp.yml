name: Temporary MS1 Lab Final Review

on:
  push:
    branches:
      - agent/ms1-generic-engine-lab-20261005

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full Teacher Support verification
        run: npm run verify:teacher-support
      - name: Record deterministic Lab checksum
        shell: bash
        run: |
          echo "=== BUILD_INFO ==="
          cat dist/ms1-lab/BUILD_INFO.json
          echo "=== SHA256SUMS DIGEST ==="
          sha256sum dist/ms1-lab/SHA256SUMS.txt
      - name: Upload isolated MS1 Lab artifact
        uses: actions/upload-artifact@v4
        with:
          name: ms1-lab-final-review
          path: dist/ms1-lab
          if-no-files-found: error
          retention-days: 7
