name: Temporary MS1 Lab TDD

on:
  push:
    branches:
      - agent/ms1-generic-engine-lab-20261005

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing Phase 0 tests
        run: npm test
      - name: Teacher Support tests when present
        shell: bash
        run: |
          mapfile -d '' tests < <(find tests/teacher-support -type f -name '*.test.js' -print0 2>/dev/null | sort -z)
          if [ "${#tests[@]}" -gt 0 ]; then
            node --test "${tests[@]}"
          else
            echo "No Teacher Support tests yet"
          fi
