name: Phase 0 Verification

on:
  push:
    branches:
      - feature/teacher-support-phase0
      - baseline/8j-r2-live-pass-20261004
  pull_request:
    branches:
      - baseline/8j-r2-live-pass-20261004
      - main

permissions:
  contents: read

jobs:
  verify-phase0:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Phase 0
        run: npm run verify:phase0
